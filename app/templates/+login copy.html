<!DOCTYPE html> 
<html>
<head>
    <meta charset="utf-8">
    <title>Login</title>
</head>
<body>
    <h1>Please Log In</h1>
    <form method="POST" action="{{ url_for('client.login') }}">
        <label for="username">Username:</label>
        <input type="text" name="username" id="username" required>

        <label for="password">Password:</label>
        <input type="password" name="password" id="password" required>

        <button type="submit">Login</button>
    </form>
    
    <p>Don't have an account? <a href="{{ url_for('client.register') }}">Register here</a></p>
</body>
</html>
