{% extends "base.html" %}

{% block content %}
<div class="profile-container">
    <h2>{{ username }}'s Saved Movies</h2>

    {% if saved_movies %}
        <ul>
            {% for movie in saved_movies %}
                <li>
                    <strong>{{ movie.title }}</strong>  
                    <br>⭐ {{ movie.rating or "No rating" }}
                    <br><img src="{{ movie.poster_path }}" alt="{{ movie.title }}">
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No saved movies yet.</p>
    {% endif %}

    <br>
    <a href="{{ url_for('main.friends') }}">🔙 Back to Friends</a>
</div>
{% endblock %}
