{% extends "base.html" %}

{% block content %}
<div class="home-container text-center">
    {% if session.get('username') %}
        <h1 class="home-title">Welcome to MovieMe, {{ session.get('username') }}! 🎬</h1>
    {% else %}
        <h1 class="home-title">Welcome to MovieMe! 🎬</h1>
    {% endif %}

    <!-- Movie Quote Section -->
    <div class="quote-container">
        <p id="movie-quote" class="quote-text">🎬 Loading quote...</p>
        <p id="movie-source" class="quote-source"></p>
    </div>
</div>
{% endblock %}
