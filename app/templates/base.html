<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieMe</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="content-wrapper">
        <div class="top-navbar">
            {% if current_user.is_authenticated %}
                <span class="welcome-text">Hi, {{ current_user.username }}!</span>
                <a href="{{ url_for('auth.logout') }}" class="top-nav-link">Logout</a>
            {% else %}
                <a href="{{ url_for('auth.login') }}" class="top-nav-link">Login</a>
                <a href="{{ url_for('auth.signup') }}" class="top-nav-link">Sign Up</a>
            {% endif %}
        </div>

        <header class="header">
            <div class="header-content">
                <div class="logo-container">
                    <img src="{{ url_for('static', filename='movieme.webp') }}" alt="MovieMe Logo" class="logo-image">
                </div>
            </div>
        </header>

        <nav class="navbar">
            <div class="nav-links">
                <a href="{{ url_for('main.home') }}" class="nav-link">Home</a>
                <a href="{{ url_for('main.profile') }}" class="nav-link">Profile</a>
                <a href="{{ url_for('main.friends') }}" class="nav-link">Friends</a>
                <a href="{{ url_for('main.chatbot') }}" class="nav-link">Chatbot</a>
                <a href="{{ url_for('search.movie_search') }}" class="nav-link">Search</a>
                <a href="{{ url_for('main.saved') }}" class="nav-link">Saved</a>
            </div>
        </nav>

        <main class="main-content">
            {% block content %}
            {% endblock %}
        </main>
    </div>
    <!-- Fetch & Display Movie Quote -->
    <script>
    document.addEventListener("DOMContentLoaded", function() {
        fetch("/get-quote")  // Fetch from flask
            .then(response => response.json())
            .then(data => {
                console.log("API Response:", data);  // Debugging

                if (data.quote && data.movie) {
                    document.getElementById("movie-quote").innerText = `"${data.quote}"`;
                    document.getElementById("movie-source").innerText = `— ${data.movie}`;
                } else {
                    document.getElementById("movie-quote").innerText = "🎬 No quote available.";
                }
            })
            .catch(error => {
                console.error("Error fetching movie quote:", error);
                document.getElementById("movie-quote").innerText = "⚠️ Failed to load quote.";
            });
    });
    </script>
</body>
</html>
