<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieMe</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="content-wrapper">
        <header class="header">
            <div class="header-content">
                <div class="logo-container">
                    <div class="icon-placeholder"></div>
                    <h1 class="app-title">MovieMe</h1>
                </div>
            </div>
        </header>

        <nav class="navbar">
            <div class="nav-links">
                <a href="{{ url_for('main.home') }}" class="nav-link">Home</a>
                <a href="{{ url_for('main.profile') }}" class="nav-link">Profile</a>
                <a href="{{ url_for('main.friends') }}" class="nav-link">Friends</a>
                <a href="{{ url_for('main.chatbot') }}" class="nav-link">Chatbot</a>
                <a href="{{ url_for('search.movie_search') }}" class="nav-link">Search</a>
                <a href="{{ url_for('main.saved') }}" class="nav-link">Saved</a>
            </div>
        </nav>

        <main class="main-content">
            {% block content %}
            {% endblock %}
        </main>
    </div>
</body>
</html>
