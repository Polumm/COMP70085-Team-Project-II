{% extends "base.html" %}

{% block content %}
<div class="profile-container">
    <h1>Your Saved Movies</h1>

    <div id="saved-movies-container" class="saved-movies-grid">
        <div class="loading">Loading your saved movies...</div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const userId = "{{ session.get('user_id') }}";

    // First try to get the URL from the template
    let dbServiceUrl = "{{ DB_SERVICE_URL }}";

    console.log("User ID:", userId);
    console.log("DB Service URL from template:", dbServiceUrl);

    // If it's empty, fall back to our known working URL
    if (!dbServiceUrl) {
        dbServiceUrl = "http://chatbot-database.uksouth.azurecontainer.io:6003";
        console.log("Using fallback DB URL:", dbServiceUrl);
    }

    // Ensure the DB service URL has the http:// prefix
    if (dbServiceUrl && !dbServiceUrl.startsWith('http')) {
        dbServiceUrl = 'http://' + dbServiceUrl;
        console.log("Added http:// prefix, now using:", dbServiceUrl);
    }

    console.log("Final DB Service URL:", dbServiceUrl);

    // Now use the URL to fetch saved movies
    fetch(`${dbServiceUrl}/movies/list?user_id=${userId}`)
        .then(response => {
            console.log("Response status:", response.status);
            return response.text().then(text => {
                try {
                    return JSON.parse(text);
                } catch (e) {
                    console.error("Failed to parse JSON:", text);
                    throw new Error(`Invalid JSON: ${text.substring(0, 100)}...`);
                }
            });
        })
        .then(data => {
            console.log("Response data:", data);
            const container = document.getElementById('saved-movies-container');
            const savedMovies = data.saved_movies || [];

            if (savedMovies.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <p>No movies saved yet.</p>
                        <a href="{{ url_for('search.movie_search') }}" class="search-btn">Find Movies to Save</a>
                    </div>
                `;
                return;
            }

            // Create HTML for saved movies
            let moviesHTML = '';
            savedMovies.forEach(movie => {
                const posterPath = movie.poster_path ?
                    (movie.poster_path.startsWith('http') ? movie.poster_path : `https://image.tmdb.org/t/p/w200${movie.poster_path}`) :
                    '';

                moviesHTML += `
                    <div class="movie-card">
                        ${posterPath ? `<img src="${posterPath}" alt="${movie.title}" class="movie-poster-img">` : ''}
                        <div class="movie-info">
                            <h4>${movie.title}</h4>
                            ${movie.rating ? `<p>Rating: ⭐ ${movie.rating}/10</p>` : ''}
                            <button class="remove-movie-btn" data-saved-id="${movie.id}">Remove</button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = moviesHTML;

            // Add event listeners to remove buttons
            document.querySelectorAll('.remove-movie-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const savedId = this.getAttribute('data-saved-id');

                    if (confirm('Are you sure you want to remove this movie from your saved list?')) {
                        fetch(`${dbServiceUrl}/movies/remove`, {
                            method: 'DELETE',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ saved_id: savedId, user_id: userId })
                        })
                        .then(response => response.json())
                        .then(data => {
                            alert("Movie removed!");
                            location.reload();  // Reload page to update UI
                        })
                        .catch(error => console.error("Error:", error));
                    }
                });
            });
        })
        .catch(error => {
            console.error('Error fetching saved movies:', error);
            document.getElementById('saved-movies-container').innerHTML = `
                <div class="error-state">
                    <p>Error loading saved movies: ${error.message}</p>
                </div>
            `;
        });
});
</script>
{% endblock %}
