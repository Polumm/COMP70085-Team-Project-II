name: CI/CD for movie-me (ACI)

on:
  push:
    branches:
      - main

env:
  PAT: ${{ secrets.PAT }}  
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
  SERVER_KEY: ${{ secrets.SERVER_KEY }}
  GHCR_USER: ${{ github.repository_owner }}
  CHATBOT_URL: ${{ secrets.CHATBOT_URL }}
  DB_SERVICE_URL: ${{ secrets.DB_SERVICE_URL }}
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

jobs:
  build-and-push-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      - name: Build and Push API Server
        run: |
          REPO_NAME=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker buildx build \
            --platform linux/amd64 \
            --build-arg CHATBOT_URL=${{ secrets.CHATBOT_URL }} \
            --build-arg DB_SERVICE_URL=${{ secrets.DB_SERVICE_URL }} \
            --build-arg TMDB_API_KEY=${{ secrets.TMDB_API_KEY }} \
            -t ghcr.io/$REPO_NAME/movie-me:latest \
            --push .

  deploy-api:
    runs-on: ubuntu-latest
    needs: build-and-push-api

    steps:
      - name: Deploy to Azure Container Instance
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            echo "🔹 Deleting existing Azure Container Instance (if any)..."
            az container delete \
              --resource-group sse-cloud-lab \
              --name movie-me \
              --yes \
              || echo "No existing container to delete."

            echo "🔹 Deploying new Azure Container Instance..."
            REPO_NAME=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

            az container create \
              --resource-group sse-cloud-lab \
              --name movie-me \
              --image ghcr.io/$REPO_NAME/movie-me:latest \
              --os-type Linux \
              --cpu 1 \
              --memory 1.5 \
              --dns-name-label movie-me \
              --ports 5000 \
              --environment-variables \
                DB_SERVICE_URL="${{ secrets.DB_SERVICE_URL }}" \
                CHATBOT_URL="${{ secrets.CHATBOT_URL }}"
                TMDB_API_KEY="${{ secrets.TMDB_API_KEY }}"

            # rather than below (below is the old way)
            # echo "🔹 Running new container..."
            # docker run -d --name movie-me -p 5000:5000 \
            #   -e FLASK_ENV=deployment \
            #   -e CHATBOT_URL="${{secrets.CHATBOT_URL}}" \
            #   -e DB_SERVICE_URL="${{secrets.DB_SERVICE_URL}}" \
            #   ghcr.io/$REPO_NAME/movie-me:latest

            echo "✅ Deployment complete!"
            exit 0
