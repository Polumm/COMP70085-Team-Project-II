name: CI/CD for ChatBot Database

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  PAT: ${{ secrets.PAT }}  
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
  SERVER_KEY: ${{ secrets.SERVER_KEY }}
  GHCR_USER: ${{ github.repository_owner }}
  CHATBOT_URL: ${{ secrets.CHATBOT_URL }}

jobs:
  build-and-push-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      - name: Build and Push API Server
        run: |
          REPO_NAME=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker buildx build \
            --platform linux/amd64 \
            --build-arg CHATBOT_URL=${{ secrets.CHATBOT_URL }} \
            -t ghcr.io/$REPO_NAME/movie-me:latest \
            --push .

  deploy-api:
    runs-on: ubuntu-latest
    needs: build-and-push-api

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            set -e  # Exit on error

            REPO_NAME=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

            echo "🔹 Stopping existing container (if running)..."
            docker stop movie-me || true  
            docker rm movie-me || true   

            echo "🔹 Pulling latest Docker image..."
            docker pull ghcr.io/$REPO_NAME/movie-me:latest

            echo "🔹 Running new container..."
            docker run -d --name movie-me -p 5000:5000 \
              -e FLASK_ENV=deployment \
              -e CHATBOT_URL="${{secrets.CHATBOT_URL}}" \
              ghcr.io/$REPO_NAME/movie-me:latest

            echo "✅ Deployment complete!"
            exit 0
