apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: movie-me-ingress
spec:
  ingressClassName: nginx  # <-- Ensure this is added
  rules:
    - host: movie-me.uksouth.cloudapp.azure.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: movie-me-service
                port:
                  number: 5000
